services:
  postgres:
    image: postgres:16-alpine
    container_name: tennis-club-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tennis_club
    volumes:
      - tennis_club_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tennis_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tennis_club_pgdata:
